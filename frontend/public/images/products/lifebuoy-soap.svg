<svg xmlns="http://www.w3.org/2000/svg" width="400" height="440" viewBox="0 0 400 440" role="img" aria-labelledby="title description">
  <title id="title">Lifebuoy Soap illustrated pack</title>
  <desc id="description">Original vector product-pack illustration for Lifebuoy Soap. Add a real product photo beside this SVG as lifebuoy-soap.jpg or lifebuoy-soap.png to use it instead.</desc>
  <defs>
    <linearGradient id="pack" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#d82930"/><stop offset="1" stop-color="#fff4ea"/></linearGradient>
    <linearGradient id="shine" x1="0" x2="1"><stop stop-color="#fff" stop-opacity=".24"/><stop offset=".45" stop-color="#fff" stop-opacity=".02"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/></linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#080611" flood-opacity=".35"/></filter>
  </defs>
  <ellipse cx="200" cy="386" rx="112" ry="15" fill="#060510" opacity=".28"/>
  <g filter="url(#shadow)" transform="rotate(-2 200 225)">
    <path d="M165 92h70l7 31v20q18 5 18 26v145q0 18-18 18h-84q-18 0-18-18V169q0-21 18-26v-20z" fill="url(#pack)" stroke="#fff" stroke-opacity=".3" stroke-width="3"/><rect x="177" y="68" width="46" height="27" rx="7" fill="#f0d653"/>
    <path d="M124 119h29v205h-29z" fill="url(#shine)" opacity=".8"/>
    <path d="M266 118h17v214h-17z" fill="#fff" opacity=".07"/>
    <rect x="117" y="158" width="166" height="131" rx="12" fill="#fff4ea" opacity=".88" stroke="#f0d653" stroke-opacity=".65" stroke-width="2"/>
    <text x="200" y="175" text-anchor="middle" class="brand">TARA DAILY</text>
    <text x="200" y="210" text-anchor="middle" class="name">Lifebuoy Soap</text>
    <path d="M172 266l14-17 14 17 14-17 14 17" fill="none" stroke="#f0d653" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="200" y="321" text-anchor="middle" class="category">PERSONAL CARE</text>
    <path d="M128 342h144" stroke="#f0d653" stroke-width="3" opacity=".7"/>
    <text x="200" y="361" text-anchor="middle" class="detail">EVERYDAY FAVOURITE</text>
  </g>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}
    .brand{fill:#f0d653;font-size:11px;font-weight:700;letter-spacing:3px}
    .name{fill:#fff;font-size:20px;font-weight:700;letter-spacing:.1px}
    .category{fill:#f0d653;font-size:10px;font-weight:700;letter-spacing:2px}
    .detail{fill:#fff;fill-opacity:.75;font-size:8px;font-weight:600;letter-spacing:1.7px}
  </style>
</svg>