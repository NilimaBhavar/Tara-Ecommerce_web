<svg xmlns="http://www.w3.org/2000/svg" width="400" height="440" viewBox="0 0 400 440" role="img" aria-labelledby="title description">
  <title id="title">Amul Milk illustrated pack</title>
  <desc id="description">Original vector product-pack illustration for Amul Milk. Add a real product photo beside this SVG as amul-milk.jpg or amul-milk.png to use it instead.</desc>
  <defs>
    <linearGradient id="pack" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#1e59a4"/><stop offset="1" stop-color="#e8f4ff"/></linearGradient>
    <linearGradient id="shine" x1="0" x2="1"><stop stop-color="#fff" stop-opacity=".24"/><stop offset=".45" stop-color="#fff" stop-opacity=".02"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/></linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#080611" flood-opacity=".35"/></filter>
  </defs>
  <ellipse cx="200" cy="386" rx="112" ry="15" fill="#060510" opacity=".28"/>
  <g filter="url(#shadow)" transform="rotate(-2 200 225)">
    <path d="M147 70h106v269q0 17-17 17h-72q-17 0-17-17z" fill="url(#pack)" stroke="#fff" stroke-opacity=".3" stroke-width="3"/><rect x="174" y="52" width="52" height="22" rx="6" fill="#ec3d36"/><path d="M147 100h106v30H147z" fill="#ec3d36" opacity=".92"/>
    <path d="M124 119h29v205h-29z" fill="url(#shine)" opacity=".8"/>
    <path d="M266 118h17v214h-17z" fill="#fff" opacity=".07"/>
    <rect x="117" y="147" width="166" height="131" rx="12" fill="#e8f4ff" opacity=".88" stroke="#ec3d36" stroke-opacity=".65" stroke-width="2"/>
    <text x="200" y="164" text-anchor="middle" class="brand">TARA DAILY</text>
    <text x="200" y="210" text-anchor="middle" class="name">Amul Milk</text>
    <path d="M145 274h110" stroke="#ec3d36" stroke-width="4" stroke-linecap="round" opacity=".9"/><path d="M160 291h80" stroke="#ec3d36" stroke-width="3" stroke-linecap="round" opacity=".65"/>
    <text x="200" y="321" text-anchor="middle" class="category">DRINKS</text>
    <path d="M128 342h144" stroke="#ec3d36" stroke-width="3" opacity=".7"/>
    <text x="200" y="361" text-anchor="middle" class="detail">EVERYDAY FAVOURITE</text>
  </g>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}
    .brand{fill:#ec3d36;font-size:11px;font-weight:700;letter-spacing:3px}
    .name{fill:#fff;font-size:20px;font-weight:700;letter-spacing:.1px}
    .category{fill:#ec3d36;font-size:10px;font-weight:700;letter-spacing:2px}
    .detail{fill:#fff;fill-opacity:.75;font-size:8px;font-weight:600;letter-spacing:1.7px}
  </style>
</svg>